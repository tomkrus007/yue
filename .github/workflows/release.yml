name: 打包发布

# 打 macOS / Windows 安装包；推 tag（v*）时同时挂到 Release。
#
# 仓库根目录没有 package.json：应用在 YX/，所以 job 级 defaults 统一设工作目录，
# `uses:` 步骤不吃 working-directory，产物路径要自己带 YX/ 前缀。
#
# 会议组件包不在这里生产（源头是官方客户端），见 YX/scripts/pack-tmsdk.sh 与
# doc/TMSDK组件化与跨平台设计.md。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 必须 arm64：组件包只有 macos-arm64（TMSDK 无 x86 slice）。
          # macos-14 镜像已由 GitHub 于 2026-11-02 退役，现在用 macos-15。
          - os: macos-15
            bundles: dmg
            artifact: yx-macos
            # 组件包平台键，对应 YX/src-tauri/components.json 的 platforms
            component: macos-arm64
          - os: windows-latest
            bundles: nsis
            artifact: yx-windows
            # Windows 组件包还没做（结构待调研）；空 = 不取头文件，编 stub
            component: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: YX
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 启用 pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: YX/src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 头文件地址从 components.json 读，和运行时组件下载共用同一处默认值
      - name: 取 TMSDK 头文件
        if: matrix.component != ''
        run: ./scripts/fetch-tmsdk-headers.sh "${{ matrix.component }}"

      - name: 打包
        env:
          # 没有 Developer ID 也要以 ad-hoc 身份签整个 .app（Tauri 认 "-"）。只靠链接器
          # 自动签名时 bundle 没有 seal，codesign 报 "code has no resources but signature
          # indicates they must be present"，下载后 Gatekeeper 直接判「YX.app 已损坏」。
          # Windows 上该变量无意义，置空。
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: 校验 macOS 包不含 TMSDK 且签名完整
        if: runner.os == 'macOS'
        run: |
          # --bundles dmg 打完后 bundle/macos/YX.app 会被清掉，只能从 dmg 里校验，
          # 否则下面的检查全是空跑（路径不存在时 if/otool 都不会报错）。
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" -quiet
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          APP="$MNT/YX.app"
          if [ -d "$APP/Contents/Frameworks/TMSDK.framework" ]; then
            echo "::error::包里又出现了 TMSDK.framework，组件化被回退了"
            exit 1
          fi
          if otool -L "$APP/Contents/MacOS/YX" | grep -q tmsdk; then
            echo "::error::主程序仍链接 tmsdk，dlopen 改造被回退了"
            exit 1
          fi
          # 未签名的 bundle 会在这里失败：signature 只描述了主程序，资源没有 seal
          codesign -v --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier=|Signature=|Sealed Resources="
          ls -lh "$DMG"

      - name: 校验 Windows 包不含 TMSDK
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -lh src-tauri/target/release/bundle/nsis/*.exe
          if find src-tauri/target/release -maxdepth 1 -iname "*wemeet*" | grep -q .; then
            echo "::error::Windows 产物里出现了 wemeet 相关 DLL，组件化被回退了"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            YX/src-tauri/target/release/bundle/dmg/*.dmg
            YX/src-tauri/target/release/bundle/nsis/*.exe

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            YX/src-tauri/target/release/bundle/dmg/*.dmg
            YX/src-tauri/target/release/bundle/nsis/*.exe
